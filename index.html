<!doctype html>
<html lang="de-CH">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0069b4"><meta name="description" content="Volleyball-Service einfach erfassen. Satzstatistiken, Wechsel, Korrekturen und Excel-Export für VBC Interlaken."><title>VBC Interlaken · Service</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head>
<body>
<header class="topbar"><a class="brand" href="#"><span class="brand-icon" aria-hidden="true">◉</span><span>VBC INTERLAKEN<small>SERVICE · MATCH TRACKER</small></span></a><button id="theme" class="ghost" aria-label="Darkmodus einschalten">☾ Darkmodus</button></header>
<main>
<div class="matchhead"><div><p class="eyebrow">JEDER AUFSCHLAG ZÄHLT.</p><h1 id="match-title">Dein Spiel. Dein Überblick.</h1><p id="match-subtitle" class="muted">Einmal Team erfassen. Alle Sätze im Blick.</p></div><span class="save-state" id="save-state" role="status">● Auf diesem Gerät gespeichert</span></div>
<nav class="tabs" aria-label="Bereiche"><button data-tab="live" class="selected">● Live-Erfassung</button><button data-tab="stats">Auswertung</button><button data-tab="log">Verlauf & Korrektur</button><button data-tab="team">Team & Match</button><button data-tab="archive">Frühere Spiele</button></nav>
<section id="live" class="panel"></section><section id="stats" class="panel" hidden></section><section id="log" class="panel" hidden></section><section id="team" class="panel" hidden></section><section id="archive" class="panel" hidden></section>
<footer><span>VBC SERVICE <b>1.6</b></span><span>Automatische Speicherung im Browser · JSON-Sicherung für Gerätewechsel</span><button data-action="help" class="link">So funktioniert’s</button></footer>
</main>
<dialog id="dialog"><form id="dialog-form"><div class="dialog-head"><h2 id="dialog-title"></h2><button type="button" id="close-dialog" class="ghost" aria-label="Fenster schliessen">✕</button></div><div id="dialog-body"></div><div id="dialog-error" role="alert"></div><div class="dialog-actions"><button type="button" id="cancel-dialog" class="secondary">Abbrechen</button><button id="dialog-submit" type="submit" class="primary">Speichern</button></div></form></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div><input id="import-file" type="file" accept=".json,application/json" hidden>
<script src="core.js"></script><script src="xlsx.js"></script><script src="app.js"></script>
</body></html>
